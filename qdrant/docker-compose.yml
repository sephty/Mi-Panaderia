services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: panaderia-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - default
      - n8n_network

networks:
  default:
  n8n_network:
    name: n8n_default
    external: true

volumes:
  qdrant_data:
    driver: local
